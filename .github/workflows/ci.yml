name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Every number in README.md must reproduce from results/
        run: python scripts/verify_readme_numbers.py
